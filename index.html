<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER CHAT // Firebase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #060911;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 760px;
      background: #0d1424;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: fit-content;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #162036;
      color: #94a3b8;
      border: 1px solid #263554;
      font-weight: 700;
    }
    .pill.live {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.12);
    }
    .bar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }
    @media (max-width: 600px) {
      .bar { grid-template-columns: 1fr; }
    }
    input {
      width: 100%;
      background: #151f36;
      border: 1px solid #283859;
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      background: #38bdf8;
      color: #04101a;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .feed {
      height: 360px;
      overflow-y: auto;
      background: #070b14;
      border: 1px solid #1b263d;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #131d33;
      border: 1px solid #20304f;
      border-radius: 10px;
      padding: 9px 12px;
      max-width: 85%;
    }
    .msg.me {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .meta {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 3px;
      font-weight: 700;
    }
    .body {
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .send-row {
      display: flex;
      gap: 8px;
    }
    .status {
      font-size: 0.78rem;
      color: #94a3b8;
      min-height: 18px;
      word-break: break-word;
    }
    .status.ok { color: #86efac; }
    .status.err { color: #fda4af; }
    details {
      font-size: 0.78rem;
      color: #94a3b8;
    }
    summary { cursor: pointer; user-select: none; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>AETHER CHAT</h1>
      <span class="pill" id="pill">URL Bekleniyor</span>
    </div>

    <div class="bar">
      <input id="nick" value="Kanka" placeholder="Adın" oninput="saveCfg()" />
      <input id="room" value="alperen-yunus-1903" placeholder="Oda kodu" oninput="connectRoom()" />
      <button type="button" onclick="connectRoom()">Bağlan</button>
    </div>

    <details open>
      <summary>Firebase Realtime Database URL</summary>
      <input id="dbUrl" placeholder="https://senin-projen-default-rtdb.firebaseio.com" oninput="saveCfg()" />
    </details>

    <div class="feed" id="feed"></div>

    <div class="send-row">
      <input id="msgInp" placeholder="Alperen'e mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button type="button" id="sendBtn" onclick="sendMessage()">Gönder</button>
    </div>

    <div class="status" id="status">Firebase Database URL girip Bağlan'a bas.</div>
  </div>

  <script>
    const CFG_KEY = "aether_fb_chat_v1";
    let timer = null;

    function setStatus(msg, type = "") {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = `status ${type}`;
    }

    function setPill(live, text) {
      const p = document.getElementById("pill");
      p.textContent = text;
      p.className = `pill ${live ? "live" : ""}`;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function cleanDbUrl() {
      const raw = (document.getElementById("dbUrl").value || "").trim();
      const match = raw.match(/https:\/\/[a-zA-Z0-9.-]+firebaseio\.com|https:\/\/[a-zA-Z0-9.-]+firebasedatabase\.app/);
      return (match ? match[0] : raw).replace(/\/+$/, "");
    }

    function cleanRoom() {
      const r = (document.getElementById("room").value || "alperen-yunus-1903").trim();
      return r.replace(/[^a-zA-Z0-9_-]/g, "_") || "alperen-yunus-1903";
    }

    function cleanNick() {
      return (document.getElementById("nick").value || "Kanka").trim() || "Kanka";
    }

    function saveCfg() {
      try {
        localStorage.setItem(CFG_KEY, JSON.stringify({
          dbUrl: cleanDbUrl(),
          room: cleanRoom(),
          nick: cleanNick()
        }));
      } catch (_) {}
    }

    function loadCfg() {
      try {
        const raw = localStorage.getItem(CFG_KEY);
        if (!raw) return;
        const c = JSON.parse(raw);
        if (c.dbUrl) document.getElementById("dbUrl").value = c.dbUrl;
        if (c.room) document.getElementById("room").value = c.room;
        if (c.nick) document.getElementById("nick").value = c.nick;
      } catch (_) {}
    }

    function renderFeed(items) {
      const feed = document.getElementById("feed");
      const me = cleanNick();
      if (!items.length) {
        feed.innerHTML = `<div class="status">Bu odada henüz mesaj yok kanka. İlk mesajı sen at!</div>`;
        return;
      }
      feed.innerHTML = items.map(m => {
        const isMe = m.who === me;
        return `
          <div class="msg ${isMe ? "me" : ""}">
            <div class="meta">${esc(m.who)} • ${esc(m.time)}</div>
            <div class="body">${esc(m.text)}</div>
          </div>
        `;
      }).join("");
      feed.scrollTop = feed.scrollHeight;
    }

    async function pullMessages(manual = false) {
      const base = cleanDbUrl();
      const room = cleanRoom();
      if (!base) {
        setPill(false, "URL Bekleniyor");
        setStatus("Önce Firebase Realtime Database URL gir.", "err");
        return;
      }

      const url = `${base}/rooms/${encodeURIComponent(room)}.json`;
      try {
        const res = await fetch(url, { cache: "no-store" });
        const raw = await res.text();
        let data = null;
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error(`Beklenmeyen yanıt (${res.status}): ${raw.slice(0, 70)}`);
        }
        if (!res.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }
        const list = data && typeof data === "object"
          ? Object.values(data).sort((a, b) => (a.ts || 0) - (b.ts || 0))
          : [];
        renderFeed(list);
        setPill(true, `Oda: ${room}`);
        if (manual) {
          setStatus(`Bağlandı (${new Date().toLocaleTimeString("tr-TR")})`, "ok");
        }
      } catch (err) {
        setPill(false, "Bağlantı Hatası");
        setStatus(`Okuma hatası: ${err.message}`, "err");
      }
    }

    async function sendMessage() {
      const base = cleanDbUrl();
      const room = cleanRoom();
      const inp = document.getElementById("msgInp");
      const btn = document.getElementById("sendBtn");
      const text = inp.value.trim();
      if (!text) return;
      if (!base) {
        setStatus("Önce Firebase Database URL gir.", "err");
        return;
      }

      saveCfg();
      btn.disabled = true;
      setStatus("Gönderiliyor...");

      const payload = {
        who: cleanNick(),
        text,
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
        ts: Date.now()
      };

      try {
        const res = await fetch(`${base}/rooms/${encodeURIComponent(room)}.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const raw = await res.text();
        let data = null;
        try { data = JSON.parse(raw); } catch (_) {}
        if (!res.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }
        inp.value = "";
        await pullMessages(true);
      } catch (err) {
        setStatus(`Gönderim hatası: ${err.message}`, "err");
      } finally {
        btn.disabled = false;
        inp.focus();
      }
    }

    function connectRoom() {
      const cleaned = cleanDbUrl();
      if (cleaned) document.getElementById("dbUrl").value = cleaned;
      saveCfg();
      if (timer) clearInterval(timer);
      pullMessages(true);
      timer = setInterval(() => pullMessages(false), 2000);
    }

    loadCfg();
    if (cleanDbUrl()) {
      connectRoom();
    }
  </script>
</body>
</html>

<div id="st_deck_wrap">
  <div class="st_deck_top">
    <span class="st_deck_title">AETHER STÜDYO MASASI + AI</span>
    <div class="st_deck_btns">
      <button type="button" class="st_deck_btn" onclick="st_deck_quickSend('Hazırım kanka!')">Hazırım</button>
      <button type="button" class="st_deck_btn" onclick="st_deck_quickSend('Geliyorum!')">Geliyorum</button>
      <button type="button" class="st_deck_btn" onclick="st_deck_copyRoom()">Oda Kodunu Kopyala</button>
      <button type="button" class="st_deck_btn" onclick="st_deck_clearRoom()">Odayı Temizle</button>
    </div>
  </div>

  <div class="st_deck_grid">
    <div>
      <label class="st_deck_label" for="st_deck_db">Firebase Realtime DB URL</label>
      <input id="st_deck_db" value="https://aetherchat25-default-rtdb.firebaseio.com" oninput="st_deck_save()" />
    </div>
    <div>
      <label class="st_deck_label" for="st_deck_gemini_key">Gemini API Key (AI Cevabı İçin)</label>
      <input id="st_deck_gemini_key" type="password" placeholder="AIza..." oninput="st_deck_save()" />
    </div>
  </div>

  <div class="st_deck_ai_box">
    <label class="st_deck_label" for="st_deck_ai_prompt">Yapay Zeka Asistanı (Cevabı Odaya Da Atar)</label>
    <div class="st_deck_ai_row">
      <input id="st_deck_ai_prompt" placeholder="AI'a soru sor, satır/punchline iste veya taktik sor..." onkeydown="if(event.key==='Enter') st_deck_askAi()" />
      <button type="button" class="st_deck_btn ai_accent" id="st_deck_ai_btn" onclick="st_deck_askAi()">AI'a Sor</button>
    </div>
  </div>

  <div>
    <label class="st_deck_label" for="st_deck_note">Stüdyo Not Defteri (Cihazda Kaydedilir)</label>
    <textarea id="st_deck_note" placeholder="Not, satır, taktik veya fikir yaz..." oninput="st_deck_save()"></textarea>
  </div>

  <div id="st_deck_info">Stüdyo masası ve AI modülü hazır.</div>
</div>

<script>
  (function () {
    const ST_KEY = "aether_bottom_studio_v2";

    function st_deck_setInfo(msg) {
      const el = document.getElementById("st_deck_info");
      if (el) el.textContent = msg;
    }

    function st_deck_getDb() {
      const val = (document.getElementById("st_deck_db")?.value || "https://aetherchat25-default-rtdb.firebaseio.com").trim();
      return val.replace(/\/+$/, "");
    }

    function st_deck_getGeminiKey() {
      return (document.getElementById("st_deck_gemini_key")?.value || "").trim();
    }

    function st_deck_getRoom() {
      const existingRoom = document.getElementById("room");
      const raw = (existingRoom?.value || "alperen-yunus-1903").trim();
      return raw.replace(/[^a-zA-Z0-9_-]/g, "_") || "alperen-yunus-1903";
    }

    function st_deck_getNick() {
      const existingNick = document.getElementById("nick");
      return (existingNick?.value || "AetherUser").trim() || "AetherUser";
    }

    async function st_deck_postToRoom(who, text) {
      const db = st_deck_getDb();
      const room = st_deck_getRoom();
      const res = await fetch(`${db}/rooms/${encodeURIComponent(room)}.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          who,
          text,
          time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
          ts: Date.now()
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    }

    window.st_deck_save = function () {
      try {
        localStorage.setItem(ST_KEY, JSON.stringify({
          db: st_deck_getDb(),
          geminiKey: st_deck_getGeminiKey(),
          note: document.getElementById("st_deck_note")?.value || ""
        }));
      } catch (_) {}
    };

    window.st_deck_copyRoom = function () {
      const room = st_deck_getRoom();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(room).catch(() => {});
      }
      st_deck_setInfo(`Oda kodu kopyalandı: ${room}`);
    };

    window.st_deck_quickSend = async function (text) {
      try {
        await st_deck_postToRoom(st_deck_getNick(), text);
        st_deck_setInfo(`Hızlı mesaj gönderildi: "${text}"`);
      } catch (err) {
        st_deck_setInfo(`Gönderim hatası: ${err.message}`);
      }
    };

    window.st_deck_clearRoom = async function () {
      const db = st_deck_getDb();
      const room = st_deck_getRoom();
      try {
        const res = await fetch(`${db}/rooms/${encodeURIComponent(room)}.json`, { method: "DELETE" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        st_deck_setInfo(`"${room}" odası temizlendi.`);
      } catch (err) {
        st_deck_setInfo(`Temizleme hatası: ${err.message}`);
      }
    };

    window.st_deck_askAi = async function () {
      const key = st_deck_getGeminiKey();
      const inp = document.getElementById("st_deck_ai_prompt");
      const btn = document.getElementById("st_deck_ai_btn");
      const prompt = (inp?.value || "").trim();

      if (!prompt) {
        st_deck_setInfo("Önce AI'a soracağın şeyi yaz kanka.");
        return;
      }
      if (!key) {
        st_deck_setInfo("AI cevabı için Gemini API Key alanına anahtarını girmen lazım.");
        return;
      }

      st_deck_save();
      if (btn) btn.disabled = true;
      st_deck_setInfo("AI düşünüyor ve odaya yazıyor...");

      try {
        await st_deck_postToRoom(`${st_deck_getNick()} (AI Soru)`, prompt);

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`;
        const aiRes = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Kısa, net ve samimi Türkçe cevap ver (sohbet odasına uygun): ${prompt}`
              }]
            }]
          })
        });

        const aiData = await aiRes.json();
        if (!aiRes.ok) {
          throw new Error(aiData?.error?.message || `Gemini HTTP ${aiRes.status}`);
        }

        const reply = aiData?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Cevap üretilemedi.";
        await st_deck_postToRoom("Aether
