<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER CHAT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #060911;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 740px;
      background: #0d1424;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: fit-content;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
      font-weight: 700;
    }
    .bar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }
    @media (max-width: 600px) {
      .bar { grid-template-columns: 1fr; }
    }
    input {
      width: 100%;
      background: #151f36;
      border: 1px solid #283859;
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      background: #38bdf8;
      color: #04101a;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .feed {
      height: 360px;
      overflow-y: auto;
      background: #070b14;
      border: 1px solid #1b263d;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #131d33;
      border: 1px solid #20304f;
      border-radius: 10px;
      padding: 9px 12px;
      max-width: 85%;
    }
    .msg.me {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .meta {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 3px;
      font-weight: 700;
    }
    .body {
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .send-row {
      display: flex;
      gap: 8px;
    }
    .note {
      font-size: 0.76rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>AETHER CHAT</h1>
      <span class="pill" id="pill">Hazır</span>
    </div>

    <div class="bar">
      <input id="nick" value="Yunus" placeholder="Adın" oninput="saveMeta()" />
      <input id="room" value="alperen-yunus-1903" placeholder="Oda kodu" oninput="switchRoom()" />
      <button type="button" onclick="clearRoom()">Odayı Temizle</button>
    </div>

    <div class="feed" id="feed"></div>

    <div class="send-row">
      <input id="msgInp" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button type="button" onclick="sendMessage()">Gönder</button>
    </div>

    <div class="note">
      Aynı cihazda ikinci bir sekme açıp aynı oda kodunu girersen anında senkron çalışır. Farklı cihazlardan dışarıya mesaj taşımak için gerçek bir arka uç/veritabanı gerekir.
    </div>
  </div>

  <script>
    const META_KEY = "aether_nosb_meta_v1";
    const ROOM_PREFIX = "aether_nosb_room_v1_";
    let bc = null;

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function roomName() {
      return (document.getElementById("room").value || "alperen-yunus-1903").trim() || "alperen-yunus-1903";
    }

    function nickName() {
      return (document.getElementById("nick").value || "Yunus").trim() || "Yunus";
    }

    function saveMeta() {
      try {
        localStorage.setItem(META_KEY, JSON.stringify({ nick: nickName(), room: roomName() }));
      } catch (_) {}
      renderFeed(readRoom());
    }

    function loadMeta() {
      try {
        const raw = localStorage.getItem(META_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (d.nick) document.getElementById("nick").value = d.nick;
        if (d.room) document.getElementById("room").value = d.room;
      } catch (_) {}
    }

    function readRoom() {
      try {
        return JSON.parse(localStorage.getItem(ROOM_PREFIX + roomName()) || "[]");
      } catch (_) {
        return [];
      }
    }

    function writeRoom(list) {
      try {
        localStorage.setItem(ROOM_PREFIX + roomName(), JSON.stringify(list.slice(-200)));
      } catch (_) {}
    }

    function renderFeed(list) {
      const feed = document.getElementById("feed");
      const me = nickName();
      if (!list.length) {
        feed.innerHTML = `<div class="note">Bu odada henüz mesaj yok kanka.</div>`;
        return;
      }
      feed.innerHTML = list.map(m => {
        const isMe = m.who === me;
        return `
          <div class="msg ${isMe ? "me" : ""}">
            <div class="meta">${esc(m.who)} • ${esc(m.time)}</div>
            <div class="body">${esc(m.text)}</div>
          </div>
        `;
      }).join("");
      feed.scrollTop = feed.scrollHeight;
    }

    function pushMessage(item, emit = true) {
      const list = readRoom();
      if (list.some(x => x.id === item.id)) return;
      list.push(item);
      writeRoom(list);
      renderFeed(list);
      if (emit && bc) {
        bc.postMessage({ room: roomName(), item });
      }
    }

    function sendMessage() {
      const inp = document.getElementById("msgInp");
      const text = inp.value.trim();
      if (!text) return;
      const item = {
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        who: nickName(),
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
        text
      };
      inp.value = "";
      pushMessage(item, true);
      inp.focus();
    }

    function clearRoom() {
      writeRoom([]);
      renderFeed([]);
      if (bc) bc.postMessage({ room: roomName(), clear: true });
    }

    function switchRoom() {
      saveMeta();
      const r = roomName();
      document.getElementById("pill").textContent = `Oda: ${r}`;
      if (bc) bc.close();
      bc = new BroadcastChannel("aether_nosb_channel_" + r);
      bc.onmessage = (ev) => {
        if (!ev.data || ev.data.room !== r) return;
        if (ev.data.clear) {
          writeRoom([]);
          renderFeed([]);
        } else if (ev.data.item) {
          pushMessage(ev.data.item, false);
        }
      };
      renderFeed(readRoom());
    }

    window.addEventListener("storage", (e) => {
      if (e.key === ROOM_PREFIX + roomName()) {
        renderFeed(readRoom());
      }
    });

    loadMeta();
    switchRoom();
  </script>
</body>
</html>
